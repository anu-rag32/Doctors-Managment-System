<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback - Doctor Management System</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <div class="container">
    <h2 style="text-align:center; color:#1e3a8a;">📋 Feedback / Query Form</h2>

    <form id="feedbackForm">
      
      <label for="name">👤 Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">📧 Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">📱 Phone Number</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>

      <label for="department">🏥 Select Department</label>
      <select id="department" name="department" required>
        <option value="">-- Choose Department --</option>
        <option value="Cardiology">Cardiology</option>
        <option value="Neurology">Neurology</option>
        <option value="Orthopedics">Orthopedics</option>
        <option value="Pediatrics">Pediatrics</option>
        <option value="Dermatology">Dermatology</option>
        <option value="Gynecology">Gynecology</option>
      </select>

      <label for="rating">⭐ Your Rating</label>
      <div class="stars" id="starRating">
        <span data-rate="1">★</span>
        <span data-rate="2">★</span>
        <span data-rate="3">★</span>
        <span data-rate="4">★</span>
        <span data-rate="5">★</span>
      </div>

      <label for="comment">💬 Your Feedback / Query</label>
      <textarea id="comment" name="comment" rows="5" placeholder="Write your comment here..." required></textarea>
      <div id="charCount">0 / 500</div>

      <button type="submit">✅ Submit</button>
    </form>

    <div id="submitted-msg"></div>
  </div>

  <footer>
    &copy; 2025 Doctor Management System | Designed by Doctrack Team | Happy Journey 💙
  </footer>

  <script>
    const commentBox = document.getElementById('comment');
    const charCount = document.getElementById('charCount');
    const stars = document.querySelectorAll("#starRating span");
    const submittedMsg = document.getElementById("submitted-msg");

    commentBox.addEventListener("input", () => {
      charCount.textContent = `${commentBox.value.length} / 500`;
    });

    // Star rating system
    let selectedRating = 0;
    stars.forEach(star => {
      star.addEventListener("click", () => {
        selectedRating = star.dataset.rate;
        stars.forEach(s => s.classList.remove("active"));
        star.classList.add("active");
        for (let i = 0; i < selectedRating; i++) {
          stars[i].classList.add("active");
        }
      });
    });

    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
      e.preventDefault();
      submittedMsg.innerHTML = `🎉 Thank you for your feedback!<br>⭐ Rating: ${selectedRating || 'Not Given'}`;
      this.reset();
      charCount.textContent = "0 / 500";
      stars.forEach(s => s.classList.remove("active"));
    });
  </script>

</body>
</html>
